<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Avicultura Caipira</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const SUPABASE_URL = "https://ryptfrminsfllojudhwb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_U2TjpnvfR4udRcv4O6lzug_ujs7nxGC";
const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  </script>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    margin: 0;
    background: #f4f6f4;
    color: #243126;
  }

  header {
    background: #2f6b3b;
    color: white;
    padding: 20px;
  }

  header h1 {
    margin: 0;
    font-size: 24px;
  }

  header p {
    margin: 5px 0 0;
    opacity: 0.9;
  }

  nav {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: white;
    border-bottom: 1px solid #ddd;
    overflow-x: auto;
  }

  nav button {
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    background: #e7efe8;
    color: #244b2b;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }

  nav button:hover {
    background: #d7e7d9;
  }

  main {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
  }

  .card h3 {
    margin: 0;
    font-size: 15px;
    color: #607064;
  }

  .numero {
    margin-top: 10px;
    font-size: 28px;
    font-weight: bold;
    color: #2f6b3b;
  }

  @media (max-width: 800px) {
    .cards {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 500px) {
    .cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

 <header>
  <h1>🐔 Controle Avicultura Caipira</h1>
  <p>Gestão completa da criação</p>
</header>

<nav>
  <button onclick="mostrarPagina('dashboard')">Dashboard</button>
  <button onclick="mostrarPagina('lotes')">Lotes</button>
  <button>Produção</button>
  <button>Chocadeira</button>
  <button>Vendas</button>
  <button>Financeiro</button>
  <button>Relatórios</button>
</nav>

<main>
 <section id="pagina-dashboard">
  <h2>Dashboard</h2>

  <div class="cards">
    <div class="card">
      <h3>Total de Aves</h3>
      <div class="numero">0</div>
    </div>

    <div class="card">
      <h3>Ovos Hoje</h3>
      <div class="numero">0</div>
    </div>

    <div class="card">
      <h3>Contas a Receber</h3>
      <div class="numero">R$ 0,00</div>
    </div>

    <div class="card">
      <h3>Resultado</h3>
      <div class="numero">R$ 0,00</div>
    </div>
  </div>
   </section>
  <section id="pagina-lotes" style="display:none;">
  <h2>Lotes</h2>

  <div class="card">
    <h3>Cadastrar novo lote</h3>

    <label>Nome do lote</label>
    <input id="loteNome" type="text" placeholder="Ex.: Poedeiras 01">

    <label>Tipo</label>
    <select id="loteTipo">
      <option value="poedeiras">Poedeiras</option>
      <option value="frangos">Frangos para abate</option>
      <option value="pintos">Pintos</option>
      <option value="outros">Outros</option>
    </select>

    <label>Raça</label>
    <input id="loteRaca" type="text" placeholder="Opcional">

    <label>Data de início</label>
    <input id="loteDataInicio" type="date">

    <label>Quantidade inicial de aves</label>
    <input id="loteQuantidade" type="number" min="0" value="0">

    <br><br>

    <button onclick="cadastrarLote()">Cadastrar lote</button>
  </div>

  <div id="listaLotes"></div>
</section>
</main>
  <script>
async function mostrarPagina(pagina) {
  document.getElementById("pagina-dashboard").style.display = "none";
  document.getElementById("pagina-lotes").style.display = "none";

  document.getElementById("pagina-" + pagina).style.display = "block";

  if (pagina === "lotes") {
    await carregarLotes();
  }
}
async function cadastrarLote() {
  const nome = document.getElementById("loteNome").value.trim();
  const tipo = document.getElementById("loteTipo").value;
  const raca = document.getElementById("loteRaca").value.trim();
  const dataInicio = document.getElementById("loteDataInicio").value;
  const quantidade = Number(document.getElementById("loteQuantidade").value);

  if (!nome) {
    alert("Digite o nome do lote.");
    return;
  }

  if (!dataInicio) {
    alert("Informe a data de início do lote.");
    return;
  }

  if (quantidade <= 0) {
    alert("Informe a quantidade de aves.");
    return;
  }

  const { data: lote, error: erroLote } = await supabaseClient
    .from("lotes")
    .insert({
      nome: nome,
      tipo: tipo,
      raca: raca || null,
      data_inicio: dataInicio,
      quantidade_atual: 0
    })
    .select()
    .single();

  if (erroLote) {
    console.error(erroLote);
    alert("Erro ao cadastrar o lote.");
    return;
  }

  const { error: erroMovimento } = await supabaseClient
    .from("movimentacoes_aves")
    .insert({
      lote_destino_id: lote.id,
      tipo: "entrada",
      motivo: "ajuste",
      quantidade: quantidade,
      observacoes: "Quantidade inicial do lote"
    });

  if (erroMovimento) {
    console.error(erroMovimento);
    alert("Lote criado, mas houve erro ao registrar a quantidade inicial.");
    return;
  }

  document.getElementById("loteNome").value = "";
  document.getElementById("loteRaca").value = "";
  document.getElementById("loteDataInicio").value = "";
  document.getElementById("loteQuantidade").value = 0;
await carregarLotes();
  alert("Lote cadastrado com sucesso!");
}
    async function carregarLotes() {
  const { data: lotes, error } = await supabaseClient
    .from("lotes")
    .select("*")
    .order("data_inicio", { ascending: false });

  if (error) {
    console.error(error);
    alert("Erro ao carregar os lotes.");
    return;
  }

  const lista = document.getElementById("listaLotes");

  if (!lotes || lotes.length === 0) {
    lista.innerHTML = "<p>Nenhum lote cadastrado.</p>";
    return;
  }

  lista.innerHTML = "";

  lotes.forEach(lote => {
    const inicio = new Date(lote.data_inicio + "T00:00:00");
    const hoje = new Date();

    const diferenca = hoje - inicio;
    const idadeDias = Math.max(
      0,
      Math.floor(diferenca / (1000 * 60 * 60 * 24))
    );

    const card = document.createElement("div");
    card.className = "card";
    card.style.marginTop = "12px";

    card.innerHTML = `
      <h3>${lote.nome}</h3>
      <p><strong>Tipo:</strong> ${lote.tipo || "-"}</p>
      <p><strong>Raça:</strong> ${lote.raca || "-"}</p>
      <p><strong>Quantidade:</strong> ${lote.quantidade_atual || 0} aves</p>
      <p><strong>Idade:</strong> ${idadeDias} dias</p>
    `;

    lista.appendChild(card);
  });
}
</script>

</body>
</html>
