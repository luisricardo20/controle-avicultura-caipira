<style>
  * {
    box-sizing: border-box;

  }

  body {
    margin: 0;
    background: #f4f6f4;
    color: #243126;
  }

  header {
    background: #2f6b3b;
    color: white;
    padding: 20px;
  }

  header h1 {
    margin: 0;
    font-size: 24px;
  }

  header p {

  nav {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: white;
    border-bottom: 1px solid #ddd;
    overflow-x: auto;
  }

  nav button {
    border: 0;
    border-radius: 8px;

    background: #e7efe8;
    color: #244b2b;
    font-weight: bold;
    cursor: pointer;

  }

  nav button:hover {
    background: #d7e7d9;
  }

  main {
    max-width: 1200px;
    margin: auto;
    padding: 18px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .card {
    background: white;
    padding: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
  }

  .card h3 {
    margin: 0;
    font-size: 15px;
    color: #607064;
  }

  .numero {
    margin-top: 10px;
    font-size: 28px;
    font-weight: bold;
    color: #2f6b3b;
  }

  @media (max-width: 800px) {
    .cards {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 500px) {
    .cards {
      grid-template-columns: 1fr;
    }
  }
</style>
